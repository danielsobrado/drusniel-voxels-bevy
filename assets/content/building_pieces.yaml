# Snap-point layouts mirror the legacy PieceDefinition constructors in
# src/gameplay/building/types.rs. Floors expose 4 edges + 4 corners, walls
# expose bottom/top plus two wall-side points so they snap edge-to-edge, and
# pillars expose bottom/top. Directions are normalized at load time.
building_pieces:
  - id: wood-floor
    legacy_piece_type_id: 1
    name: Wood Floor
    category: floor
    dimensions: [2.0, 0.2, 2.0]
    can_ground: true
    material_type: wood
    snap_points:
      - id: edge-north
        local_offset: [0.0, 0.0, -1.0]
        direction: [0.0, 0.0, -1.0]
        snap_group: floor-edge
        compatible_groups: [floor-edge, wall-bottom]
        compatible_piece_ids: []
      - id: edge-south
        local_offset: [0.0, 0.0, 1.0]
        direction: [0.0, 0.0, 1.0]
        snap_group: floor-edge
        compatible_groups: [floor-edge, wall-bottom]
        compatible_piece_ids: []
      - id: edge-west
        local_offset: [-1.0, 0.0, 0.0]
        direction: [-1.0, 0.0, 0.0]
        snap_group: floor-edge
        compatible_groups: [floor-edge, wall-bottom]
        compatible_piece_ids: []
      - id: edge-east
        local_offset: [1.0, 0.0, 0.0]
        direction: [1.0, 0.0, 0.0]
        snap_group: floor-edge
        compatible_groups: [floor-edge, wall-bottom]
        compatible_piece_ids: []
      - id: corner-nw
        local_offset: [-1.0, 0.0, -1.0]
        direction: [-1.0, 0.0, -1.0]
        snap_group: floor-edge
        compatible_groups: [floor-edge]
        compatible_piece_ids: []
      - id: corner-ne
        local_offset: [1.0, 0.0, -1.0]
        direction: [1.0, 0.0, -1.0]
