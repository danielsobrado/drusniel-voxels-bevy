# Guard thresholds for clod-edit-events.csv generated by clod_edit_events_export.
# The guard validates the expanded, per-frame scripted edit events before the
# bench runtime is allowed to mutate terrain from them.

allow_empty = false
require_sorted_frames = true
require_contiguous_occurrences = true
require_strictly_increasing_group_frames = true
require_consistent_repeat_delta = true

max_frame = 1000000
max_radius = 128.0
min_strength = 0.0
max_strength = 16.0
max_dirty_pages = 1024
max_expected_publish_frames = 600
max_expected_collider_refresh_frames = 900
