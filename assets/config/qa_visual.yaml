          type: "region_luminance"
          screenshot: "fog"
          region: [0.0, 0.0, 1.0, 0.55]
          min: 0.02
          max: 0.98
        - id: "fog_frame_not_flat"
          type: "region_variance"
          screenshot: "fog"
          region: [0.0, 0.0, 1.0, 1.0]
          min_luminance_stddev: 0.01
      timing:
