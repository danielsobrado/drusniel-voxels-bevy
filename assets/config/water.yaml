# Enhanced Water Rendering Configuration
# Gerstner waves, foam, and caustics

gerstner:
  enabled: true
  # Base wave height (meters)
  amplitude: 0.9
  # Scale of wave patterns (larger = longer wavelengths)
  wave_scale: 0.85
  # Wave animation speed multiplier
  wave_speed: 1.3
  # Number of wave layers (1-4, more = better quality but slower)
  wave_count: 4

foam:
  enabled: true
  # Foam color (RGB, 0-1)
  color: [1.0, 1.0, 1.0]
  # Foam brightness multiplier
  intensity: 1.3
  # Foam texture scale
  scale: 1.2
  # How long foam persists (0-1)
  persistence: 0.9
  # Generate foam at shorelines
  shore_foam: true
  # Generate foam at wave crests
  wave_crest_foam: true

caustics:
  enabled: true
  # Caustic light intensity
  intensity: 0.85
  # Caustic pattern scale
  scale: 1.2
  # Animation speed
  speed: 1.0
  # Maximum depth for caustic visibility (meters)
  max_depth: 10.0

visual:
  # Deep water color (RGBA)
  deep_color: [0.01, 0.04, 0.12, 0.98]
  # Shallow water color (RGBA)
  shallow_color: [0.04, 0.18, 0.36, 0.9]
  # Water clarity (0 = murky, 1 = crystal clear)
  clarity: 0.14
  # Surface reflectivity (0-1)
  reflectivity: 0.88
  # Fresnel effect power (higher = more edge reflection)
  fresnel_power: 5.6

body_presets:
  ocean:
    wave_amplitude: 3.6
    wave_speed: 1.3
    wave_scale: 0.85
    wave_count: 4
    reflection_strength: 0.88
    fresnel_power: 5.6
    distortion_strength: 0.02
    shallow_color: [0.04, 0.18, 0.36, 0.9]
    deep_color: [0.01, 0.04, 0.12, 0.98]
    clarity: 0.14
    base_alpha: 0.9
    foam_enabled: true
    shore_foam: true
    wave_crest_foam: true
    murkiness: 0.1
    detail_normal_intensity: 0.8
    detail_scroll_speed: 0.04
    lake_ripple_overlay_strength: 1.0

  lake:
    wave_amplitude: 0.36
    wave_speed: 0.5
    wave_scale: 1.1
    wave_count: 2
    reflection_strength: 0.84
    fresnel_power: 4.4
    distortion_strength: 0.005
    shallow_color: [0.006, 0.038, 0.055, 0.92]
    deep_color: [0.0, 0.006, 0.02, 0.98]
    clarity: 0.55
    base_alpha: 0.92
    foam_enabled: true
    shore_foam: true
    wave_crest_foam: false
    murkiness: 0.22
    detail_normal_intensity: 1.35
    detail_scroll_speed: 0.02
    lake_ripple_overlay_strength: 0.22

  river:
    wave_amplitude: 0.22
    wave_speed: 0.65
    wave_scale: 1.6
    wave_count: 2
    reflection_strength: 0.58
    fresnel_power: 4.0
    distortion_strength: 0.008
    shallow_color: [0.045, 0.14, 0.17, 0.72]
    deep_color: [0.01, 0.035, 0.06, 0.84]
    clarity: 0.1
    base_alpha: 0.72
    foam_enabled: true
    shore_foam: true
    wave_crest_foam: false
    murkiness: 0.28
    detail_normal_intensity: 0.45
    detail_scroll_speed: 0.026
    lake_ripple_overlay_strength: 0.28

  pond:
    wave_amplitude: 0.08
    wave_speed: 0.3
    wave_scale: 3.0
    wave_count: 1
    reflection_strength: 0.68
    fresnel_power: 4.0
    distortion_strength: 0.0035
    shallow_color: [0.035, 0.085, 0.07, 0.76]
    deep_color: [0.01, 0.026, 0.02, 0.9]
    clarity: 0.42
    base_alpha: 0.76
    foam_enabled: false
    shore_foam: false
    wave_crest_foam: false
    murkiness: 0.42
    detail_normal_intensity: 0.55
    detail_scroll_speed: 0.012
    lake_ripple_overlay_strength: 0.08

  shallow_flood:
    wave_amplitude: 0.015
    wave_speed: 0.18
    wave_scale: 4.0
    wave_count: 1
    reflection_strength: 0.12
    fresnel_power: 3.0
    distortion_strength: 0.001
    shallow_color: [0.12, 0.18, 0.18, 0.34]
    deep_color: [0.04, 0.075, 0.08, 0.42]
    clarity: 0.25
    base_alpha: 0.34
    foam_enabled: false
    shore_foam: false
    wave_crest_foam: false
    murkiness: 0.65
    detail_normal_intensity: 0.1
    detail_scroll_speed: 0.006
    lake_ripple_overlay_strength: 0.0

detail_normals:
  enabled: true
  # UV scale for primary ripple normal map
  scale_a: 0.3
  # UV scale for secondary ripple normal map
  scale_b: 0.17
  # Normal map influence strength (0-1)
  intensity: 0.8
  # Scroll speed for animated ripples
  scroll_speed: 0.04

reflections:
  enabled: true
  # Render resolution as fraction of main camera (0.35 = ~672x378)
  resolution_scale: 0.35
  # Disable shadows in reflection camera for performance
  disable_shadows: true
  # Max distance for reflection camera rendering
  max_render_distance: 150.0
  # How much wave normals distort the reflection image
  distortion_strength: 0.02
  # Render reflection every N frames (2 = every other frame)
  update_every_n_frames: 2

refraction:
  enabled: true
  # UV offset strength for underwater distortion
  strength: 0.03
  # Index of refraction for water
  ior: 1.33
  # Separate R/G/B channels for rainbow edge effect
  chromatic_aberration: false

displacement:
  enabled: true
  # Compute shader texture resolution (NxN pixels)
  resolution: 1024
  # World area covered by the displacement texture (meters)
  world_size: 128.0
  # Wave propagation speed factor
  wave_speed: 0.98
  # Energy damping per frame (0.99 = slow decay)
  damping: 0.995
  # Radius of player water interaction impulse
  player_impulse_radius: 1.5
  # Strength of player water interaction
  player_impulse_strength: -0.3

weather:
  # Multiplies rain_factor before adding compositor reflection strength.
  rain_reflection_boost: 0.12
  # Multiplies rain_factor before increasing compositor UV distortion.
  rain_distortion_boost: 0.35
  # Multiplies snow_factor before reducing harsh reflection blend.
  snow_reflection_soften: 0.18

witchcraft_finish:
  # Disabled by default; enable with this flag or VOXEL_WATER_WITCHCRAFT_FINISH=1.
  enabled: false
  # Shaderpack-style water finish style. Supported values: 1 or 3.
  style: 1
  # 3 preserves the source block's green minimum before tinting.
  watercolor_mode: 3
  # Legacy pre-1.13 color path from the source block.
  legacy: false
  # Optional post-finish RGB multiplier.
  color_multiplier_enabled: false
  color_multiplier: [1.0, 1.0, 1.0]
  # 200 enables the finish reflection multiplier; 160 disables it.
  reflect_b: 200
  # 0 normal, 1 color, 2 Fresnel alpha, 3 reflection multiplier.
  debug: 0

# Quality presets
quality_presets:
  low:
    gerstner:
      wave_count: 2
    foam:
      enabled: false
    caustics:
      enabled: false
  
  medium:
    gerstner:
      wave_count: 3
    foam:
      enabled: true
      shore_foam: true
      wave_crest_foam: false
    caustics:
      enabled: true
      intensity: 0.3
  
  high:
    gerstner:
      wave_count: 4
    foam:
      enabled: true
    caustics:
      enabled: true
  
  ultra:
    gerstner:
      wave_count: 4
      amplitude: 0.6
    foam:
      enabled: true
      intensity: 1.2
    caustics:
      enabled: true
      intensity: 0.7
