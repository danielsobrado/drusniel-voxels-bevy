# Shader weather state.
# This file drives tiny uniforms only. It does not configure CPU particles,
# terrain mutation, puddle maps, snow accumulation, or water displacement.

enabled: true
quality: high
initial_kind: clear
transition_seconds: 4.0
wetness_transition_seconds: 8.0

rain:
  factor: 1.0
  overlay_density: 0.55
  wetness: 0.85
  puddle_strength: 0.35
  snow_tint_strength: 0.0

snow:
  factor: 1.0
  overlay_density: 0.35
  wetness: 0.0
  puddle_strength: 0.0
  snow_tint_strength: 0.65

low_gpu:
  disable_precip_overlay: true
  disable_puddle_detail: true
