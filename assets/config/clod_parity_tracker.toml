# CLOD parity tracker between tools/clod-poc and the Bevy runtime.
#
# status values:
#   ported     - implemented or represented in the Rust/Bevy tree
#   qa         - covered by diagnostics/guards, not necessarily gameplay-visible
#   planned    - next implementation target
#   intentional_skip - known PoC feature that should not be ported as-is
#
# The tracker is intentionally file/path based so CI can detect accidental
# removals while reviewers can still read the rationale in one place.

[[item]]
id = "selection-runtime-controls"
category = "runtime"
priority = "high"
status = "ported"
title = "CLOD selection runtime controls"
poc_refs = ["tools/clod-poc/src/clod/selection.ts", "tools/clod-poc/src/clod/runtime/clodCutFreeze.ts"]
bevy_paths = ["src/voxel/pages/selection.rs", "src/voxel/pages/debug_overlay.rs", "src/voxel/pages/runtime_stats_export.rs"]
notes = "Relief-biased error, forced/frozen selection and runtime counters are represented by the PR 1-3 stack."

