bevy_paths = ["src/voxel/pages/crossfade.rs", "src/voxel/pages/crossfade_runtime.rs", "src/voxel/pages/dither_material.rs", "src/voxel/pages/fade_material.rs", "assets/shaders/terrain/clod_dither.wgsl"]
