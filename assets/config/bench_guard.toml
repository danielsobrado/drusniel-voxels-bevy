# Bench-only regression guard for completed render optimizations.
# Run manually after a bench; this is not part of normal cargo build/check.

[[check]]
name = "ridge_frame_avg"
scene = "visual-regression.toml"
checkpoint = "ridge-run-noon"
area = "__frame_total"
field = "avg_ms"
warn_gt = 11.08
fail_gt = 13.01
unit = "ms"

