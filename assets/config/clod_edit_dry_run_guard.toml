# Guard thresholds for clod-edit-dry-run.csv generated by clod_edit_dry_run_export.

# The dry-run CSV should contain at least one row for the scripted edit stress scene.
min_rows = 1

# Until real mutation is wired, every row must stay in dry_run mutation mode.
require_dry_run_mode = true

# The dry-run adapter marks rows as ready only when dirty-page expectations match.
require_ready_status = true

# The adapter should keep dirty_lod0_pages inside the per-row expected range.
require_expected_dirty_page_match = true

# Bounds for conservative dirty-page plans. The default CLOD PoC gate is 8x8 LOD0 pages.
max_dirty_lod0_pages_per_request = 64
max_dirty_total_nodes_per_request = 128

# Request frames should be deterministic and non-decreasing.
require_monotonic_frames = true

# Safety range for terrain edit parameters.
min_radius = 0.01
max_radius = 256.0
min_strength = 0.0001
max_strength = 10.0
