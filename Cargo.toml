[package]
name = "voxel_builder"
version = "0.1.0"
edition = "2024"
default-run = "voxel_builder"

[features]
default = ["naadf"]
# cargo run --release --features tracy then connect with Tracy 0.11.x.
tracy = ["bevy/trace_tracy"]
legacy_prop_spawn = []
# Derived voxel ray cache. Compiled by default so runtime NAADF toggles are available;
# keep naadf_debug separate for heavier diagnostics.
naadf = []
naadf_debug = ["naadf"]
# Legacy MC + Transvoxel LOD seam spike (kept off default while the CLOD path owns far field).
mc_transvoxel = ["dep:transvoxel-data"]

[dependencies]
# CLOD pages decimation (src/voxel/pages). meshopt builds the C meshoptimizer via cc on
# first compile only. Attribute-aware simplification with vertex locks; see clod-phase5-plan.
meshopt = "0.6"
bevy = { version = "0.18.1", default-features = false, features = [
    "3d_bevy_render",
    "async_executor",
    "bevy_asset",
    "bevy_audio",
    "bevy_input_focus",
    "bevy_log",
    "bevy_state",
    "bevy_winit",
    "custom_cursor",
    "default_font",
    "dynamic_linking",
    "jpeg",
    "keyboard",
    "mouse",
    "multi_threaded",
    "pbr_specular_textures",
    "picking",
    "png",
    "reflect_auto_register",
    "scene",
    "sysinfo_plugin",
    "ui_bevy_render",
    "vorbis",
] }
bevy_mesh = "0.18.1"
bevy_shader = "0.18.1"
bevy_water = "0.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"
ron = "0.8"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png"] }
fast-surface-nets = "0.2"
ndshape = "0.3"
bincode = "1.3"
bytemuck = { version = "1.20", features = ["derive"] }
fs2 = "0.4"
bevy_egui = "0.39.1"
bevy-inspector-egui = "0.36.0"
bevy_hanabi = "0.18.0"
bevy_mod_outline = "0.12.0"
bevy_tweening = "0.15.0"
leafwing-input-manager = "0.20.0"
iyes_progress = "0.16.0"
avian3d = { version = "0.5", features = ["3d", "parallel", "parry-f32", "debug-plugin"] }
bevy-tnua = "0.30.0"
bevy-tnua-avian3d = "0.10.0"
pollster = "0.4.0"
wgpu = { version = "27.0.1", default-features = false, features = ["dx12", "vulkan"] }
rand = "0.8"
sysinfo = "0.37"
transvoxel-data = { version = "0.2.1", optional = true }

[dev-dependencies]
criterion = "0.5"
rstest = "0.22"
tempfile = "3.10"

[[bench]]
name = "meshing_benchmark"
harness = false

[[bench]]
name = "world_benchmark"
harness = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
