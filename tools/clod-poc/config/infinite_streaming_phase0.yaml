phase0:
  target_visible_m: 4096
  target_future_visible_m: 8192
  streaming:
    preload_seconds: 4.0
    live_radius_m: 200
    clod_radius_m: 2048
    clod_refinement_radius_m: 768
    far_clipmap_radius_m: 768

  scenes:
    long_view_4km:
      world: 16
      camera:
        mode: fixed
        x_ratio: 0.50
        z_ratio: 0.50
        y_offset_m: 260
        look_distance_m: 4096
      require_visible_m: 4096

    long_view_forest_4km:
      world: 16
      camera:
        mode: fixed
        x_ratio: 0.45
        z_ratio: 0.45
        y_offset_m: 320
        look_distance_m: 4096
      require_visible_m: 4096
      require_canopy_metrics: true

    long_view_edit_stress:
      world: 16
      camera:
        mode: scripted
        x_ratio: 0.50
        z_ratio: 0.50
        y_offset_m: 180
        look_distance_m: 4096
      scripted_edits: true
      require_visible_m: 4096

    infinite_stream_straight:
      world: 16
      camera:
        mode: scripted
        start_x_ratio: 0.20
        start_z_ratio: 0.50
        direction_degrees: 90
        speed_mps: 18
        duration_seconds: 20
        look_distance_m: 4096
      simulated_streaming_only: true

    infinite_stream_fast_turn:
      world: 16
      camera:
        mode: scripted
        start_x_ratio: 0.50
        start_z_ratio: 0.50
        speed_mps: 12
        duration_seconds: 20
        turn_degrees_per_second: 90
        look_distance_m: 4096
      simulated_streaming_only: true

    infinite_stream_far_summary:
      world: 16
      camera:
        mode: scripted
        start_x_ratio: 0.20
        start_z_ratio: 0.50
        direction_degrees: 90
        speed_mps: 18
        duration_seconds: 60
        look_distance_m: 4096

    infinite_stream_slow_builds:
      world: 16
      camera:
        mode: scripted
        start_x_ratio: 0.20
        start_z_ratio: 0.50
        direction_degrees: 90
        speed_mps: 10
        duration_seconds: 30
        look_distance_m: 4096

    infinite_islands:
      world: 16
      camera:
        mode: scripted
        start_x_ratio: 0.50
        start_z_ratio: 0.50
        direction_degrees: 60
        speed_mps: 24
        duration_seconds: 160
        turn_degrees_per_second: 12
        look_distance_m: 8192
      require_visible_m: 8192

    infinite_far_shell_straight:
      world: 16
      camera:
        mode: scripted
        start_x_ratio: 0.20
        start_z_ratio: 0.50
        direction_degrees: 90
        speed_mps: 18
        duration_seconds: 30
        look_distance_m: 8192
      simulated_streaming_only: true

    infinite_far_shell_fast_turn:
      world: 16
      camera:
        mode: scripted
        start_x_ratio: 0.50
        start_z_ratio: 0.50
        speed_mps: 12
        duration_seconds: 30
        turn_degrees_per_second: 90
        look_distance_m: 8192
      simulated_streaming_only: true

    infinite_far_shell_mountain_approach:
      world: 16
      camera:
        mode: scripted
        start_x_ratio: 0.50
        start_z_ratio: 0.50
        speed_mps: 15
        duration_seconds: 25
        direction_degrees: 45
        look_distance_m: 8192
      simulated_streaming_only: true

    long_view_8km:
      world: 16
      camera:
        mode: fixed
        x_ratio: 0.50
        z_ratio: 0.50
        y_offset_m: 400
        look_distance_m: 8192
      require_visible_m: 8192

    long_view_16km:
      world: 16
      camera:
        mode: fixed
        x_ratio: 0.50
        z_ratio: 0.50
        y_offset_m: 600
        look_distance_m: 16384
      require_visible_m: 16384

