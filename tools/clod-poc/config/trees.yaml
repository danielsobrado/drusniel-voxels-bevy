trees:
  enabled: true
  seed: 7331
  distance_m: 620
  refresh_distance_m: 16
  max_new_patches_per_frame: 2
  max_instances: 9000

  gpu:
    enabled: true
    prefer_webgpu: true
    fallback_to_cpu: true
    scatter_enabled: true
    cull_enabled: true
    max_visible: 50000
    workgroup_size: 64
    readback_visible_lists: false
    debug_force_cpu: false
    debug_show_gpu_counts: false
    debug_validate_against_cpu: false
    terrain_visibility:
      enabled: true
      min_distance_m: 96
      sample_count: 6
      height_margin_m: 1.75
      crown_height_m: 5.5
      cull_visible: true
      cull_shadows: true

  placement:
    spacing_m: 5.5
    jitter: 0.72
    slope_min_y: 0.64
    min_height_m: 10
    max_height_m: 58
    min_ground_weight: 0.14
    min_spacing_m: 3.4

  lod:
    near_fraction: 0.042
    mid_fraction: 0.18
    far_fraction: 0.35
    impostor_fraction: 1.0
    hysteresis_m: 8
    crossfade_enabled: true
    crossfade_band_m: 24
    dither_enabled: true
    shadows_max_lod: near
    budgets:
      # Budgets are high because procedural grammar trees generate real
      # branch/leaf geometry instead of alpha cards.  Typical range:
      #   near: 30k-260k  mid: 13k-90k  far: 6.5k-40k
      near_max_vertices: 260000
      mid_max_vertices: 90000
      far_max_vertices: 40000
      impostor_max_vertices: 240

  # WebGPU impostor bake target: 8x8 frames at 128px => 1024² atlas.
  # Albedo RGBA8 + normal-depth RGBA8 cost ~8 MiB/species, ~48 MiB for
  # the six-species TREE-9 target. Keep URL/UI toggles available for disabling.
  impostors:
    enabled: true
    bake_on_start: true
    fallback_to_placeholder: false
    source_lod: mid
    resolution_px: 128
    octahedral_grid_size: 8
    atlas_padding_px: 2
    alpha_test: 0.45
    frame_update_distance_m: 2.0
    axial_billboard: true
    preserve_vertical: true
    max_bakes_per_frame: 1
    debug_show_frames: false
    debug_freeze_frame: -1
    future_normal_depth: true

  wind:
    enabled: true
    direction: [0.8, 0.6]
    strength: 0.18
    speed: 0.9
    gust_strength: 0.12
    trunk_sway_strength: 0.45
    leaf_flutter_strength: 0.18

  ecology:
    enabled: true
    density:
      base_density: 1.2
      forest_noise_scale_m: 96
      forest_noise_strength: 0.9
      clearing_noise_scale_m: 180
      clearing_threshold: 0.68
      clearing_softness: 0.18
      edge_softness_m: 12
    terrain:
      lowland_height_m: 16
      highland_height_m: 42
      height_fade_m: 8
      slope_fade_start_y: 0.62
      slope_fade_end_y: 0.9
      material_weight_power: 1.35
    material_bias:
      grass:
        density: 1.08
        oak: 1.22
        pine: 0.86
        dead: 0.52
        birch: 1.12
        willow: 1.04
        spruce: 0.72
      rock:
        density: 0.46
        oak: 0.35
        pine: 0.96
        dead: 1.55
        birch: 0.42
        willow: 0.22
        spruce: 1.12
      sand:
        density: 0.55
        oak: 0.72
        pine: 0.45
        dead: 0.68
        birch: 0.82
        willow: 1.16
        spruce: 0.28
