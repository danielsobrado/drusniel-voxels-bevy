procedural_textures:
  enabled: true
  seed: 1337
  runtime_mode: generate_if_missing

  noise:
    resolution: 1024
    periods:
      value: 256
      fbm: 64
      ridged: 32
      worley: 128
    channels:
      noise_a: [value, fbm3, fbm3_dx, fbm3_dz]
      noise_b: [ridged_dx, ridged_dz, ridged3, worley_f1]

  terrain:
