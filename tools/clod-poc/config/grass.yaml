grass:
  enabled: true
  shader_mode: webgpu-ring-v1
  seed: 1337
  patch_distance_m: 125
  refresh_distance_m: 8
  max_new_patches_per_frame: 1
  max_instances_per_tier: 64000

  placement:
    spacing_m: 0.85
    jitter: 0.42
    slope_min_y: 0.72
    min_height_m: 12
    max_height_m: 28
    min_grass_weight: 0.05

  terrain:
    grass:
      density: 1.12
    rock:
      density: 0.18
    sand:
      density: 0.58
    snow:
      density: 0.02
    height:
      low_height_m: 14.0
      high_height_m: 34.0
      height_blend_m: 8.0
      low:
        density: 1.04
      mid:
        density: 1.00
      high:
        density: 0.58

  lod:
    near_fraction: 0.30
    mid_fraction: 0.68
    far_density_ratio: 0.16
    mid_instance_fraction: 0.38
    far_instance_fraction: 0.12
    dither_band_m: 12

  blade:
    height_m: 0.62
    height_variation: 0.48
    width_m: 0.026
    near_blades_per_instance: 7
    mid_blades_per_instance: 4
    near_segments: 4
    mid_segments: 2
    far_tuft_width_m: 0.11
    near_crossed_quads: true
    max_width_compensation: 1.45

  wind:
    direction: [0.8, 0.6]
    strength: 0.22
    speed: 1.15
    gust_strength: 0.12

  render:
    alpha_to_coverage: false
    dither_fade: true

  debug:
    show_lod_colors: false
    show_patch_bounds: false

  ring:
    # 1024 @ 0.4 m keeps the same ~410 m coverage as 512 @ 0.8 m but quadruples
    # slot density (1.56 -> 6.25 slots/m²) toward the fable5 meadow look; the
    # GPU ring culls/compacts, so cost scales with visible instances, not slots.
    grid: 1024
    cell: 0.4
    max_radius: 160
    ring_distance: 160
    near_meters: 32
    mid_meters: 82
    far_meters: 120
    far_distance_fraction: 0.96
    band_meters: 12
    scruff_meters: 38
    scruff_min_density: 0.42
