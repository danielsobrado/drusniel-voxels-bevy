construction:
  enabled: true
  snap:
    radius_m: 0.85
    spatial_cell_m: 1.0
    min_alignment: 0.70
    alignment_weight: 0.65
    tangent_weight: 0.25
    distance_weight: 0.35
    release_radius_multiplier: 1.35
    max_ray_distance_m: 32
  placement:
    max_ray_distance_m: 8000
    terrain_step_m: 2
    overlap_padding_m: 0.04
    overlap_spatial_cell_m: 4.0
    allow_heightfield_fallback: false
    storage_key: drusniel.clod-poc.construction.v1
  stability:
    collapse_threshold: 0.20
    epsilon: 0.0001
    max_island_size: 4096
    max_collapses_per_frame: 8
    connection_tolerance_m: 0.08
    vertical_connection_min_ratio: 0.55
  support_profiles:
    wood:
      max_support: 1.0
      vertical_decay: 0.06
      horizontal_decay: 0.10
      support_class: wood
    brick:
      max_support: 1.0
      vertical_decay: 0.10
      horizontal_decay: 0.16
      support_class: stone
    concrete:
      max_support: 1.0
      vertical_decay: 0.04
      horizontal_decay: 0.07
      support_class: ground
    marble:
      max_support: 1.0
      vertical_decay: 0.09
      horizontal_decay: 0.15
      support_class: stone
    tiles:
      max_support: 1.0
      vertical_decay: 0.30
      horizontal_decay: 0.45
      support_class: stone
    stone:
      max_support: 1.0
      vertical_decay: 0.10
      horizontal_decay: 0.18
      support_class: stone
    metal:
      max_support: 1.0
      vertical_decay: 0.03
      horizontal_decay: 0.05
      support_class: ground
    thatch:
      max_support: 1.0
      vertical_decay: 1.0
      horizontal_decay: 1.0
      support_class: wood
  ghost:
    opacity: 0.42
  terrain_conform:
    enabled: false
    foundation_categories: [floor, foundation]
    pad_margin_m: 0.35
    fill_depth_m: 2.5
    trim_height_m: 1.2
    falloff_m: 0.12
    material_slot: 1
  pieces:
    - id: wood-floor-2x2
      label: Floor
      category: floor
      dimensions_m: [2.0, 0.2, 2.0]
      can_ground: true
      material: wood
      ground_normal_min_y: 0.45
      snap_points:
        - id: edge-north
          local_pos: [0.0, 0.1, -1.0]
          direction: [0.0, 0.0, -1.0]
          tangent: [1.0, 0.0, 0.0]
          group: floor-edge
          accepts: [floor-edge, wall-bottom, wall-top]
        - id: edge-south
          local_pos: [0.0, 0.1, 1.0]
          direction: [0.0, 0.0, 1.0]
          tangent: [1.0, 0.0, 0.0]
          group: floor-edge
          accepts: [floor-edge, wall-bottom, wall-top]
        - id: edge-west
          local_pos: [-1.0, 0.1, 0.0]
          direction: [-1.0, 0.0, 0.0]
          tangent: [0.0, 0.0, 1.0]
          group: floor-edge
          accepts: [floor-edge, wall-bottom, wall-top]
        - id: edge-east
          local_pos: [1.0, 0.1, 0.0]
          direction: [1.0, 0.0, 0.0]
          tangent: [0.0, 0.0, 1.0]
          group: floor-edge
          accepts: [floor-edge, wall-bottom, wall-top]

    - id: wood-wall-2x2
      label: Wall
      category: wall
      dimensions_m: [2.0, 2.0, 0.2]
      can_ground: false
      material: wood
      snap_points:
        - id: bottom
          local_pos: [0.0, -1.0, 0.0]
          direction: [0.0, -1.0, 0.0]
          tangent: [1.0, 0.0, 0.0]
          group: wall-bottom
          accepts: [floor-edge, wall-top]
        - id: top
          local_pos: [0.0, 1.0, 0.0]
          direction: [0.0, 1.0, 0.0]
          tangent: [1.0, 0.0, 0.0]
          group: wall-top
          accepts: [floor-edge, wall-bottom, wall-top, roof-edge]
        - id: left
          local_pos: [-1.0, 0.0, 0.0]
          direction: [-1.0, 0.0, 0.0]
          tangent: [0.0, 1.0, 0.0]
          group: wall-side
          accepts: [wall-side]
        - id: right
          local_pos: [1.0, 0.0, 0.0]
          direction: [1.0, 0.0, 0.0]
          tangent: [0.0, 1.0, 0.0]
          group: wall-side
          accepts: [wall-side]

    - id: wood-fence-2x1
      label: Fence
      category: fence
      dimensions_m: [2.0, 1.0, 0.1]
      can_ground: true
      material: wood
      snap_points:
        - id: bottom
          local_pos: [0.0, -0.5, 0.0]
          direction: [0.0, -1.0, 0.0]
          tangent: [1.0, 0.0, 0.0]
          group: wall-bottom
          accepts: [floor-edge, wall-top]
        - id: left
          local_pos: [-1.0, 0.0, 0.0]
          direction: [-1.0, 0.0, 0.0]
          tangent: [0.0, 1.0, 0.0]
          group: generic
          accepts: [generic]
        - id: right
          local_pos: [1.0, 0.0, 0.0]
          direction: [1.0, 0.0, 0.0]
          tangent: [0.0, 1.0, 0.0]
          group: generic
          accepts: [generic]

    - id: wood-pillar-2m
      label: Pillar
      category: pillar
      dimensions_m: [0.4, 2.0, 0.4]
      can_ground: true
      material: wood
      support_profile:
        max_support: 1.0
        vertical_decay: 0.04
        horizontal_decay: 0.08
        support_class: wood
      snap_points:
        - id: bottom
          local_pos: [0.0, -1.0, 0.0]
          direction: [0.0, -1.0, 0.0]
          tangent: [1.0, 0.0, 0.0]
          group: floor-edge
          accepts: [floor-edge, wall-top]
        - id: top
          local_pos: [0.0, 1.0, 0.0]
          direction: [0.0, 1.0, 0.0]
          tangent: [1.0, 0.0, 0.0]
          group: wall-top
          accepts: [floor-edge, wall-bottom, wall-top, roof-edge]
