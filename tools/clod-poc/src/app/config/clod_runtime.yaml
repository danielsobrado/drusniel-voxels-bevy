runtime:
  world_options: [2, 4, 8, 16, 32]

webgpu_selection:
  error_max_age_frames: 6
  dispatch_interval_frames: 2
  parity_interval_frames: 60
  error_tolerance_px: 0.02

terrain_textures:
  texture_array_size: 512

near_field:
  chunk_group_build_budget: 1
  max_cached_chunk_groups: 64
  evict_distance_multiplier: 2.5

page_geometry_cache:
  enabled: true
  max_entries: 8192
  warn_at_entries: 6144

render_node_cache:
  enabled: true
  max_inactive_nodes: 512
  prune_interval_frames: 30
  prefetch_parent: true
  prefetch_children: false
  max_prefetch_creates_per_frame: 8
  warn_at_inactive_nodes: 480

digging:
  hold_interval_ms: 400

profiling:
  slow_frame_ms: 24
