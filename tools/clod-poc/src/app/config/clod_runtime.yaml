runtime:
  world_options: [2, 4, 8, 16, 32]

webgpu_selection:
  error_max_age_frames: 6
  dispatch_interval_frames: 2
  parity_interval_frames: 60
  error_tolerance_px: 0.02

terrain_textures:
  texture_array_size: 512

near_field:
  chunk_group_build_budget: 1
  max_cached_chunk_groups: 64
  evict_distance_multiplier: 2.5

page_geometry_cache:
  enabled: true
  # Active geometries are never evicted; render_node_cache keeps the active set small.
  max_entries: 8192
  warn_at_entries: 6144

render_node_cache:
  enabled: true
  max_inactive_nodes: 512
  prune_interval_frames: 30
  prefetch_parent: true
  prefetch_children: false
  max_prefetch_creates_per_frame: 8
  warn_at_inactive_nodes: 480
  evict_geometry_with_render_node: true

selection_cut_cache:
  enabled: true
  camera_cell_size_m: 1.0
  camera_height_cell_size_m: 2.0
  target_cell_size_m: 1.0
  angle_bucket_deg: 1.0
  threshold_bucket_px: 0.05
  bubble_center_cell_size_m: 1.0
  max_reuse_frames: 8

material_churn:
  enabled: true
  collect_material_versions: true
  collect_renderer_programs: true
  log_spike_warnings: false
  spike_warn_threshold_per_frame: 32
  max_tracked_materials: 4096

render_resolution:
  dpr_cap: 1.5
  render_scale: 1.0
  min_effective_pixel_ratio: 0.5
  max_effective_pixel_ratio: 2.0
  presets:
    performance100:
      dpr_cap: 1.0
      render_scale: 0.85
    low:
      dpr_cap: 1.0
      render_scale: 0.75
    medium:
      dpr_cap: 1.25
      render_scale: 0.9
    high:
      dpr_cap: 1.5
      render_scale: 1.0
    ultra:
      dpr_cap: 2.0
      render_scale: 1.0

digging:
  hold_interval_ms: 400

profiling:
  slow_frame_ms: 24
