runtime:
  world_options: [2, 4, 8, 16, 32]

webgpu_selection:
  error_max_age_frames: 6
  dispatch_interval_frames: 2
  parity_interval_frames: 60
  error_tolerance_px: 0.02

terrain_textures:
  texture_array_size: 512

near_field:
  chunk_group_build_budget: 1
  max_cached_chunk_groups: 64
  evict_distance_multiplier: 2.5

page_geometry_cache:
  enabled: true
  # Active geometries are never evicted; render_node_cache keeps the active set small.
  max_entries: 8192
  warn_at_entries: 6144

render_node_cache:
  enabled: true
  max_inactive_nodes: 512
  prune_interval_frames: 30
  prefetch_parent: true
  prefetch_children: false
  max_prefetch_creates_per_frame: 4
  warn_at_inactive_nodes: 480
  evict_geometry_with_render_node: true

clod_apply:
  enabled: true
  max_apply_ms_per_frame: 1.0
  max_geometry_jobs_per_frame: 2
  max_collider_jobs_per_frame: 1
  keep_stale_visible: true
  prioritize_lod0: true
  prioritize_near_camera: true
  collider_max_delay_frames: 8
  debug_log_spikes: false
  spike_log_threshold_ms: 2.0

selection_cut_cache:
  enabled: true
  camera_cell_size_m: 1.0
  camera_height_cell_size_m: 2.0
  target_cell_size_m: 1.0
  angle_bucket_deg: 1.0
  threshold_bucket_px: 0.05
  bubble_center_cell_size_m: 1.0
  max_reuse_frames: 120

material_churn:
  enabled: false
  collect_material_versions: false
  collect_renderer_programs: false
  log_spike_warnings: false
  spike_warn_threshold_per_frame: 32
  max_tracked_materials: 1024

render_resolution:
  dpr_cap: 1.0
  render_scale: 0.85
  min_effective_pixel_ratio: 0.5
  max_effective_pixel_ratio: 1.25
  dynamic_resolution:
    enabled: true
    target_ms: 16.6
    min_scale: 0.7
    max_scale: 1.0
    step_up: 0.025
    step_down: 0.05
    sample_window_frames: 30
    settle_frames: 20
    upscale_headroom_ms: 2.0
    downscale_over_ms: 1.0
  presets:
    performance100:
      dpr_cap: 1.0
      render_scale: 0.85
    low:
      dpr_cap: 1.0
      render_scale: 0.75
    medium:
      dpr_cap: 1.0
      render_scale: 0.85
    high:
      dpr_cap: 1.25
      render_scale: 0.9
    ultra:
      dpr_cap: 1.5
      render_scale: 1.0

digging:
  hold_interval_ms: 400

profiling:
  slow_frame_ms: 24

stats:
  normal_hz: 2
  debug_hz: 6
  profile_every_frame: false
