postprocess:
  enabled: true
  opacity: 1.0
  render_scale: 0.75
  exposure: 1.0
  contrast: 1.05
  saturation: 1.04
  vignette: 0.08
  debug_mode: output
  tone_mapping: agx

  bloom:
    enabled: true
    threshold: 0.48
    strength: 0.26
    radius: 0.90

  fxaa:
    enabled: true
    edge_threshold: 0.125
    subpixel_blend: 0.75

  taa:
    enabled: false
    history_weight: 0.88
    depth_threshold: 0.0025
    sharpen: 0.06
    jitter_enabled: false
    jitter_scale: 1.0
    history_clamp_enabled: false
    history_clamp_strength: 1.0

  contact_shadows:
    enabled: true
    strength: 0.30
    radius_px: 1.7
    depth_bias: 0.002

  clarity:
    enabled: true
    sharpen: 0.06
    dither: 0.002

  webgpu:
    clouds_enabled: false
    gtao_enabled: false
    froxels_enabled: true
    bounce_enabled: false

  god_rays:
    mode: volumetric
    density: 0.96
    decay: 0.92
    weight: 0.35
    exposure: 0.6
