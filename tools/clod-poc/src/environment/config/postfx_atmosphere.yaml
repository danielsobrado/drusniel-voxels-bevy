postfx_atmosphere:
  hillaire:
    enabled: true
    strength: 1.0
    rayleigh_color: [0.62, 0.72, 0.86]
    mie_color: [1.0, 0.92, 0.80]
    rayleigh_scale_height_m: 8200.0
    mie_scale_height_m: 1200.0
    # Per-meter sea-level extinction, green channel; RGB spread comes from
    # RAYLEIGH_SPECTRAL_RATIO in code. Real-sky magnitude: ~50% light loss
    # in the blue channel at 12 km, a few percent at 1 km.
    rayleigh_extinction: 0.0000135
    # Mie raised above the clear-sky value to give the 1-6 km band a visible
    # haze that carries the near->far terrain hand-off; still energy-conserving.
    mie_extinction: 0.000046
    # Broader phase than 0.76 so away-sun terrain gains haze light instead of
    # sitting in the forward lobe's shadow (distance must lighten, not darken).
    mie_g: 0.62
    max_distance_m: 12000.0
  froxels:
    enabled: true
    strength: 0.26
    max_distance_m: 480.0
    near_m: 2.0
    steps: 16
    ground_reference_m: 0.0
    ground_fog_density: 0.0085
    altitude_fog_density: 0.0012
    ground_falloff_m: 20.0
    altitude_falloff_m: 140.0
    sun_density_boost: 1.8
    ambient_density_floor: 0.10
    sun_shafts_strength: 0.82
    noise_strength: 0.42
