<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLOD Pages PoC</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d22; }
      #info {
        position: absolute; top: 8px; left: 8px; color: #eef3f8;
        max-width: min(720px, calc(100vw - 286px));
        padding: 7px 9px; border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(12, 15, 19, 0.68); border-radius: 4px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
        font: 12px/1.45 monospace; white-space: pre; pointer-events: none;
        text-shadow: 0 1px 1px #000;
        backdrop-filter: blur(3px);
      }
      @media (max-width: 760px) { #info { max-width: calc(100vw - 22px); } }
      #player-mode-bar {
        position: absolute; top: 104px; left: 8px; z-index: 12;
        display: flex; align-items: center; gap: 6px; padding: 6px;
        color: #eef3f8; background: rgba(12, 15, 19, 0.74);
        border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 4px;
        font: 12px/1.3 system-ui, -apple-system, Segoe UI, sans-serif;
        backdrop-filter: blur(3px);
      }
      #player-mode-bar button {
        min-width: 58px; padding: 5px 9px; border: 1px solid #46515e;
        border-radius: 3px; color: #dce5ee; background: #20262d; cursor: pointer;
      }
      #player-mode-bar button:hover { background: #2b343e; }
      #player-mode-bar button[aria-pressed="true"] {
        border-color: #74b8f5; color: #fff; background: #245781;
      }
      #player-mode-status { margin-left: 3px; color: #b9c7d5; white-space: nowrap; }
      body[data-player-mode="choosingSpawn"] canvas { cursor: crosshair; }
      body[data-player-mode="playing"] canvas { cursor: none; }
      #build-progress[hidden] { display: none; }
      #build-progress {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        z-index: 30; width: min(440px, calc(100vw - 32px)); padding: 14px;
        color: #eef3f8; background: rgba(12, 15, 19, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 6px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
        font: 12px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
        backdrop-filter: blur(4px);
      }
      #build-progress-label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
      #build-progress-bar {
        width: 100%; height: 10px; appearance: none; overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 999px;
      }
      #build-progress-bar::-webkit-progress-bar { background: #11161d; }
      #build-progress-bar::-webkit-progress-value { background: linear-gradient(90deg, #55a9ff, #8ce6b5); }
      #build-progress-bar::-moz-progress-bar { background: linear-gradient(90deg, #55a9ff, #8ce6b5); }
      #texture-modal[hidden] { display: none; }
      #texture-modal {
        position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
        background: rgba(9, 11, 14, 0.72); color: #d8dde4;
        font: 12px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
      }
      .texture-panel {
        width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
        overflow: auto; background: #171a1f; border: 1px solid #3a414c;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
      }
      .texture-panel header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 14px; border-bottom: 1px solid #303640;
      }
      .texture-panel h2 { margin: 0; font-size: 14px; font-weight: 650; }
      .texture-panel button {
        border: 1px solid #48515f; background: #252b33; color: #e8edf3;
        min-height: 28px; padding: 4px 9px; cursor: pointer;
      }
      .texture-panel button:hover { background: #303842; }
      .texture-panel-body { padding: 14px; }
      .texture-slot-grid {
        display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
      }
      .texture-slot {
        width: 100%; padding: 8px; display: grid; gap: 6px;
        background: #101318; border: 1px solid #303640;
      }
      .texture-preview {
        aspect-ratio: 1 / 1; width: 100%; padding: 0; background: #0b0d10 center / cover no-repeat;
        display: grid; place-items: center; color: #7f8996;
      }
      .texture-slot-name {
        overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
        color: #dce3ea;
      }
      .texture-slot-param {
        display: grid; grid-template-columns: 32px minmax(0, 1fr); align-items: center; gap: 6px;
        color: #aeb8c4;
      }
      .texture-slot-param input {
        width: 100%; min-width: 0; box-sizing: border-box;
        background: #f6f7f8; border: 1px solid #545c68; color: #11161d;
      }
      .texture-controls {
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px;
        margin-top: 14px;
      }
      .texture-controls label { display: grid; gap: 4px; color: #b9c1ca; }
      .texture-controls input[type="range"] { width: 100%; }
      .texture-actions {
        display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px;
      }
      @media (max-width: 560px) {
        .texture-slot-grid, .texture-controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <div id="info">building…</div>
    <div id="player-mode-bar" aria-label="View mode">
      <button id="orbit-mode" type="button" aria-pressed="true">Orbit</button>
      <button id="player-mode" type="button" aria-pressed="false">Player</button>
      <span id="player-mode-status">Orbit camera</span>
    </div>
    <div id="build-progress">
      <div id="build-progress-label">
        <span id="build-progress-phase">preparing</span>
        <span id="build-progress-percent">0%</span>
      </div>
      <progress id="build-progress-bar" max="1" value="0"></progress>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
