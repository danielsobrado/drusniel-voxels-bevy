command_allowlist:
  schema_version: 1
  commands:
    - id: clod-manifest-validate
      target: clod-poc
      lane: static
      program: npm
      args: [--prefix, tools/clod-poc, run, visual:validate]
      cwd: .
      timeout_ms: 120000
      continue_on_failure: false
      environment: {}
      placeholders: []
      artifacts: []

    - id: clod-typecheck
      target: clod-poc
      lane: static
      program: npm
      args: [--prefix, tools/clod-poc, run, typecheck]
      cwd: .
      timeout_ms: 300000
      continue_on_failure: false
      environment: {}
      placeholders: []
      artifacts: []

    - id: clod-unified-tests
      target: clod-poc
      lane: static
      program: npm
      args: [--prefix, tools/clod-poc, run, test, --, src/qa/unified, src/qa/lookdev]
      cwd: .
      timeout_ms: 300000
      continue_on_failure: false
      environment: {}
      placeholders: []
      artifacts: []

    - id: bevy-manifest-validate
      target: bevy
      lane: static
      program: cargo
      args: [run, --bin, qa, --, --manifest-validate-only]
      cwd: .
      timeout_ms: 600000
      continue_on_failure: false
      environment: {}
      placeholders: []
      artifacts: []

    - id: bevy-unified-tests
      target: bevy
      lane: static
      program: cargo
      args: [test, diagnostics::qa::unified]
      cwd: .
      timeout_ms: 900000
      continue_on_failure: false
      environment: {}
      placeholders: []
      artifacts: []

    - id: clod-capture-smoke
      target: clod-poc
      lane: gpu
      program: npm
      args: [--prefix, tools/clod-poc, run, qa:capture, --, --output, "${OUTPUT_DIR}/targets/clod-poc", --scene, clod_poc_main_view]
      cwd: .
      timeout_ms: 900000
      continue_on_failure: false
      environment:
        DRUSNIEL_QA_RUN_INDEX: "${RUN_INDEX}"
      placeholders: [OUTPUT_DIR, RUN_INDEX]
      artifacts:
        - path: "${OUTPUT_DIR}/targets/clod-poc/environment.json"
          required: true
          deterministic: false
          kind: json
          ignore_json_keys: [captured_utc]
          numeric_tolerance: 0
        - path: "${OUTPUT_DIR}/targets/clod-poc/determinism.json"
          required: true
          deterministic: true
          kind: json
          ignore_json_keys: [averageHash]
          numeric_tolerance: 0
          numeric_tolerances:
            "$.scenes[*].image.probes[*].metrics.**": 0.005
            "$.scenes[*].image.signature.linearRgbGrid[*]": 0.003
            "$.scenes[*].image.signature.luminanceHistogram[*]": 0.005
            "$.scenes[*].image.signature.edgeHistogram[*]": 0.005

    - id: clod-capture-full
      target: clod-poc
      lane: full
      program: npm
      args: [--prefix, tools/clod-poc, run, qa:capture, --, --output, "${OUTPUT_DIR}/targets/clod-poc"]
      cwd: .
      timeout_ms: 1800000
      continue_on_failure: false
      environment:
        DRUSNIEL_QA_RUN_INDEX: "${RUN_INDEX}"
      placeholders: [OUTPUT_DIR, RUN_INDEX]
      artifacts:
        - path: "${OUTPUT_DIR}/targets/clod-poc/environment.json"
          required: true
          deterministic: false
          kind: json
          ignore_json_keys: [captured_utc]
          numeric_tolerance: 0
        - path: "${OUTPUT_DIR}/targets/clod-poc/determinism.json"
          required: true
          deterministic: true
          kind: json
          ignore_json_keys: [averageHash]
          numeric_tolerance: 0
          numeric_tolerances:
            "$.scenes[*].image.probes[*].metrics.**": 0.005
            "$.scenes[*].image.signature.linearRgbGrid[*]": 0.003
            "$.scenes[*].image.signature.luminanceHistogram[*]": 0.005
            "$.scenes[*].image.signature.edgeHistogram[*]": 0.005

    - id: clod-lookdev-smoke
      target: clod-poc
      lane: gpu
      program: npm
      args: [--prefix, tools/clod-poc, run, lookdev:smoke, --, --out, "${OUTPUT_DIR}/lookdev/smoke"]
      cwd: .
      timeout_ms: 900000
      continue_on_failure: false
      environment:
        DRUSNIEL_QA_RUN_INDEX: "${RUN_INDEX}"
      placeholders: [OUTPUT_DIR, RUN_INDEX]
      artifacts:
        - path: "${OUTPUT_DIR}/lookdev/smoke/report.json"
          required: true
          deterministic: false
          kind: json
          ignore_json_keys: []
          numeric_tolerance: 0
        - path: "${OUTPUT_DIR}/lookdev/smoke/determinism.json"
          required: true
          deterministic: true
          kind: json
          ignore_json_keys: [averageHash]
          numeric_tolerance: 0
          numeric_tolerances:
            "$.captures[*].signature.linearRgbGrid[*]": 0.003
            "$.captures[*].signature.luminanceHistogram[*]": 0.005
            "$.captures[*].signature.edgeHistogram[*]": 0.005
            "$.captures[*].sanity.metrics.**": 0.005

    - id: clod-lookdev-full
      target: clod-poc
      lane: full
      program: npm
      args: [--prefix, tools/clod-poc, run, lookdev:full, --, --out, "${OUTPUT_DIR}/lookdev/full"]
      cwd: .
      timeout_ms: 1800000
      continue_on_failure: true
      environment:
        DRUSNIEL_QA_RUN_INDEX: "${RUN_INDEX}"
      placeholders: [OUTPUT_DIR, RUN_INDEX]
      artifacts:
        - path: "${OUTPUT_DIR}/lookdev/full/report.json"
          required: true
          deterministic: false
          kind: json
          ignore_json_keys: []
          numeric_tolerance: 0
        - path: "${OUTPUT_DIR}/lookdev/full/determinism.json"
          required: true
          deterministic: true
          kind: json
          ignore_json_keys: [averageHash]
          numeric_tolerance: 0
          numeric_tolerances:
            "$.captures[*].signature.linearRgbGrid[*]": 0.003
            "$.captures[*].signature.luminanceHistogram[*]": 0.005
            "$.captures[*].signature.edgeHistogram[*]": 0.005
            "$.captures[*].sanity.metrics.**": 0.005

    - id: bevy-capture-smoke
      target: bevy
      lane: gpu
      program: cargo
      args: [run, --release, --bin, qa, --, --run-bench, --scene, bevy-ridge-noon, --output, "${OUTPUT_DIR}/targets/bevy", --bench-out, "${OUTPUT_DIR}/targets/bevy/bench", --bench-profile, release]
      cwd: .
      timeout_ms: 3600000
      continue_on_failure: false
      environment:
        DRUSNIEL_QA_RUN_INDEX: "${RUN_INDEX}"
      placeholders: [OUTPUT_DIR, RUN_INDEX]
      artifacts:
        - path: "${OUTPUT_DIR}/targets/bevy/bench/summary.json"
          required: true
          deterministic: false
          kind: json
          ignore_json_keys: [run_started_utc, duration_secs]
          numeric_tolerance: 0
        - path: "${OUTPUT_DIR}/targets/bevy/report.json"
          required: true
          deterministic: false
          kind: json
          ignore_json_keys: [run_started_utc, duration_secs]
          numeric_tolerance: 0

    - id: bevy-stage-smoke
      target: bevy
      lane: gpu
      program: cargo
      args: [run, --release, --bin, qa_stage, --, --summary, "${OUTPUT_DIR}/targets/bevy/bench/summary.json", --qa-report, "${OUTPUT_DIR}/targets/bevy/report.json", --output, "${OUTPUT_DIR}/targets/bevy", --scene, bevy-ridge-noon]
      cwd: .
      timeout_ms: 900000
      continue_on_failure: false
      environment: {}
      placeholders: [OUTPUT_DIR]
      artifacts:
        - path: "${OUTPUT_DIR}/targets/bevy/environment.json"
          required: true
          deterministic: false
          kind: json
          ignore_json_keys: [captured_utc]
          numeric_tolerance: 0
        - path: "${OUTPUT_DIR}/targets/bevy/determinism.json"
          required: true
          deterministic: true
          kind: json
          ignore_json_keys: [frame_ms, median_frame_ms, p95_frame_ms, p99_frame_ms, path, baseline_path]
          numeric_tolerance: 0.005

    - id: bevy-capture-full
      target: bevy
      lane: gpu
      program: cargo
      args: [run, --release, --bin, qa, --, --run-bench, --output, "${OUTPUT_DIR}/targets/bevy", --bench-out, "${OUTPUT_DIR}/targets/bevy/bench", --bench-profile, release]
      cwd: .
      timeout_ms: 3600000
      continue_on_failure: false
      environment:
        DRUSNIEL_QA_RUN_INDEX: "${RUN_INDEX}"
      placeholders: [OUTPUT_DIR, RUN_INDEX]
      artifacts:
        - path: "${OUTPUT_DIR}/targets/bevy/bench/summary.json"
          required: true
          deterministic: false
          kind: json
          ignore_json_keys: [run_started_utc, duration_secs]
          numeric_tolerance: 0
        - path: "${OUTPUT_DIR}/targets/bevy/report.json"
          required: true
          deterministic: false
          kind: json
          ignore_json_keys: [run_started_utc, duration_secs]
          numeric_tolerance: 0

    - id: bevy-stage-full
      target: bevy
      lane: gpu
      program: cargo
      args: [run, --release, --bin, qa_stage, --, --summary, "${OUTPUT_DIR}/targets/bevy/bench/summary.json", --qa-report, "${OUTPUT_DIR}/targets/bevy/report.json", --output, "${OUTPUT_DIR}/targets/bevy"]
      cwd: .
      timeout_ms: 900000
      continue_on_failure: false
      environment: {}
      placeholders: [OUTPUT_DIR]
      artifacts:
        - path: "${OUTPUT_DIR}/targets/bevy/environment.json"
          required: true
          deterministic: false
          kind: json
          ignore_json_keys: [captured_utc]
          numeric_tolerance: 0
        - path: "${OUTPUT_DIR}/targets/bevy/determinism.json"
          required: true
          deterministic: true
          kind: json
          ignore_json_keys: [frame_ms, median_frame_ms, p95_frame_ms, p99_frame_ms, path, baseline_path]
          numeric_tolerance: 0.005

    - id: clod-infinite-acceptance
      target: clod-poc
      lane: full
      program: npm
      args: [--prefix, tools/clod-poc, run, accept:infinite-islands, --, --reuse]
      cwd: .
      timeout_ms: 1800000
      continue_on_failure: true
      environment: {}
      placeholders: []
      artifacts: []

    - id: clod-water-verify
      target: clod-poc
      lane: full
      program: npm
      args: [--prefix, tools/clod-poc, run, water:verify]
      cwd: .
      timeout_ms: 1800000
      continue_on_failure: true
      environment: {}
      placeholders: []
      artifacts: []

    - id: clod-tree-parity
      target: clod-poc
      lane: full
      program: npm
      args: [--prefix, tools/clod-poc, run, trees:qa-parity]
      cwd: .
      timeout_ms: 1800000
      continue_on_failure: true
      environment: {}
      placeholders: []
      artifacts: []

    - id: bevy-bench-guard
      target: bevy
      lane: full
      program: cargo
      args: [run, --bin, bench_guard, --, "${OUTPUT_DIR}/targets/bevy/bench/summary.json"]
      cwd: .
      timeout_ms: 900000
      continue_on_failure: true
      environment: {}
      placeholders: [OUTPUT_DIR]
      artifacts: []
