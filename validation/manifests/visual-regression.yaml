visual_regression:
  schema_version: 1
  baseline_version: 1
  default_target: clod-poc
  output_root: validation-runs
  scenes:
    - id: clod_poc_main_view
      target: clod-poc
      lane: gpu
      enabled: true
      tags: [legacy-visual, smoke, terrain]
      launch:
        world_seed: 1
        world_mode: finite
        scene: web
        quality: balanced
        render_resolution_preset: high
        viewport: [2560, 1440]
        device_pixel_ratio: 1
        camera:
          position: [0.0, 96.0, 0.0]
          yaw_deg: 151.8
          pitch_deg: -24.6
          fov_y_deg: 55.0
        lighting:
          time_of_day_hours: 12.0
          sun_elevation_deg: 55.0
          sun_azimuth_deg: 145.0
        weather:
          wind_time_s: 0.0
          cloud_time_s: 0.0
          particle_time_s: 0.0
          precipitation: none
        flags: {}
      settle:
        ready_timeout_ms: 120000
        warmup_frames: 240
        settle_frames: 60
        freeze_after_settle: true
      capture:
        checkpoint: main
        image: viewport
        include_hud: false
        include_debug_overlays: false
      baseline:
        image: validation/baselines/clod-poc/clod_poc_main_view/baseline.png
        stats: validation/baselines/clod-poc/clod_poc_main_view/baseline.stats.json
        metrics: validation/baselines/clod-poc/clod_poc_main_view/baseline.metrics.json
        mask: null
        sha256: null
      image_gates:
        required: false
        changed_pixel_threshold: 0.05
        mean_absolute_error_max: 0.012
        p95_absolute_error_max: 0.040
        changed_pixel_fraction_max: 0.025
        edge_error_mean_max: 0.018
        luminance_mean_delta_max: 0.025
        luminance_stddev_delta_max: 0.030
        chroma_mean_delta_max: 0.025
      region_probes:
        - id: viewport_has_signal
          rect_normalized: [0.0, 0.0, 1.0, 1.0]
          gates:
            luminance_mean: { min: 0.02, max: 0.98 }
        - id: viewport_not_flat
          rect_normalized: [0.0, 0.0, 1.0, 1.0]
          gates:
            luminance_stddev: { min: 0.01 }
      timing_gates:
        - id: frame_p95
          metric: frame_ms_p95
          max: 24.0
          enforcement: advisory
          required: true
      counter_gates:
        - id: draws
          key: areas.renderer.draw_calls
          operator: max
          value: 2000
          required: false
        - id: gpu_mesh_parity_unmatched
          key: areas.gpu_mesh.parity_unmatched
          operator: max
          value: 0
          required: true
        - id: gpu_mesh_parity_delta
          key: areas.gpu_mesh.parity_max_vertex_delta
          operator: max
          value: 0.02
          required: true
        - id: texture_load_errors
          key: areas.assets.texture_load_errors
          operator: max
          value: 0
          required: false
      informational_metrics: []
      specialized_commands: []

    - id: long_view_4km
      target: clod-poc
      lane: gpu
      enabled: true
      tags: [legacy-visual, long-view, terrain, vegetation]
      launch:
        world_seed: 12345
        world_mode: continent
        scene: long-view-4km
        quality: balanced
        render_resolution_preset: high
        viewport: [2560, 1440]
        device_pixel_ratio: 1
        camera:
          position: [2048.0, 184.0, 2048.0]
          yaw_deg: 151.8
          pitch_deg: -14.0
          fov_y_deg: 55.0
        lighting:
          time_of_day_hours: 12.0
          sun_elevation_deg: 55.0
          sun_azimuth_deg: 145.0
        weather:
          wind_time_s: 0.0
          cloud_time_s: 0.0
          particle_time_s: 0.0
          precipitation: none
        flags:
          world: 16
          clodPerf: 1
          webgpuSelection: 1
      settle:
        ready_timeout_ms: 360000
        warmup_frames: 300
        settle_frames: 90
        freeze_after_settle: true
      capture:
        checkpoint: main
        image: viewport
        include_hud: false
        include_debug_overlays: false
      baseline:
        image: validation/baselines/clod-poc/long_view_4km/baseline.png
        stats: validation/baselines/clod-poc/long_view_4km/baseline.stats.json
        metrics: validation/baselines/clod-poc/long_view_4km/baseline.metrics.json
        mask: null
        sha256: null
      image_gates:
        required: false
        changed_pixel_threshold: 0.05
        mean_absolute_error_max: 0.012
        p95_absolute_error_max: 0.040
        changed_pixel_fraction_max: 0.025
        edge_error_mean_max: 0.018
        luminance_mean_delta_max: 0.025
        luminance_stddev_delta_max: 0.030
        chroma_mean_delta_max: 0.025
      region_probes:
        - id: horizon_has_signal
          rect_normalized: [0.0, 0.0, 1.0, 0.2]
          gates:
            luminance_mean: { min: 0.02, max: 0.98 }
        - id: horizon_not_flat
          rect_normalized: [0.0, 0.0, 1.0, 0.2]
          gates:
            luminance_stddev: { min: 0.005 }
        - id: far_band_has_silhouette
          rect_normalized: [0.0, 0.2, 1.0, 0.4]
          gates:
            luminance_stddev: { min: 0.01 }
      timing_gates:
        - id: frame_p95
          metric: frame_ms_p95
          max: 24.0
          enforcement: advisory
          required: true
      counter_gates:
        - id: draws
          key: areas.renderer.draw_calls
          operator: max
          value: 4000
          required: false
        - id: terrain_triangles_exist
          key: areas.clod.terrain_triangles
          operator: min
          value: 1000
          required: true
        - id: terrain_draw_calls_exist
          key: areas.clod.terrain_draw_calls
          operator: min
          value: 1
          required: true
        - id: far_shell_tris_exist
          key: areas.far_shell.far_shell_tris
          operator: min
          value: 1000
          required: false
        - id: gpu_grass_visible
          key: areas.gpu_grass.visible
          operator: min
          value: 1
          required: false
        - id: gpu_tree_visible
          key: areas.gpu_tree.visible
          operator: min
          value: 1
          required: false
        - id: gpu_stone_visible
          key: areas.gpu_stone.visible
          operator: min
          value: 1
          required: false
        - id: horizon_hole_ratio_zero
          key: areas.clod.horizon_hole_ratio
          operator: max
          value: 0.05
          required: false
      informational_metrics:
        - id: shadow_proxy_tris_exist
          key: areas.shadow_proxy.shadow_proxy_tris
          required: false
        - id: canopy_tris_exist
          key: areas.canopy_shell.canopy_tris
          required: false
      specialized_commands: []
