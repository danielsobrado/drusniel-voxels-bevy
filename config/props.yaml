# Prop persistence configuration
persistence:
  # Enable/disable prop persistence (saves placements to disk)
  enabled: true
  # Directory for save files
  save_directory: "saves/props"
  # Use pretty-printed JSON (slower but readable)
  pretty_json: true

# Material style overrides for consistent look
style:
  # Boost color saturation (Valheim has vibrant colors)
  saturation_boost: 0.12
  # Minimum roughness to reduce shininess
  roughness_min: 0.75
  # Maximum metallic to keep matte look
  metallic_max: 0.05
  # Clamp foliage brightness to avoid blowout
  foliage_brightness_max: 0.7
  # Default tint for untextured rock materials
  rock_tint: [0.45, 0.43, 0.4]
  custom:
    # Extra boost for photoreal foliage cards
    saturation_boost: 0.15
    # Brighten custom foliage slightly
    brightness_boost: 0.05
    # Push custom foliage towards matte
    roughness_min: 0.85
    # Force non-metallic for plants
    metallic_max: 0.0
    # Reduce photoreal shading detail
    disable_normal_maps: true
    disable_occlusion_maps: true

# GPU-driven prop cull/indirect-draw pipeline (default off; CPU path is the fallback).
gpu_vegetation:
  enabled: false
  force_cpu_fallback: false
  disable_on_integrated_gpu: true
  target_layer: "props_foliage"
  buffers:
    max_source_instances: 262144
    max_visible_main: 131072
    max_visible_shadow_per_cascade: 65536
  culling:
    max_draw_distance_m: 160.0
    lod_end_m: [32.0, 72.0, 128.0]
    fade_band_m: 12.0
    hysteresis_m: 8.0
    shadows: true
    max_shadow_distance_m: 96.0
  debug:
    allow_gpu_readback: false
    emit_metrics: true
