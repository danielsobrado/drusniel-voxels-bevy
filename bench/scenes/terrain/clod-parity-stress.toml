# Deterministic CLOD parity stress scene.
#
# Purpose:
# - keep terrain LOD live instead of frozen;
# - move across rugged terrain so relief-biased CLOD selection is exercised;
# - revisit the historical terrain-hole repro point;
# - sprint across a terrain boundary to shake page-tree rebuild/selection state;
# - produce useful CSV input for clod_stats_guard and clod_rebuild_guard.
#
# Run through scripts/run-clod-parity-bench.sh or scripts/run-clod-parity-bench.ps1
# so the CLOD CSV exporters and guards are enabled consistently.

seed = 12345
duration_warmup_secs = 3.0
median_runs = 1
chunk_load_radius = 7
freeze_terrain_lod_after_ready = false
world_cache_path = "bench-runs/cache/clod-parity-stress-world.bin"

[[checkpoint]]
name = "clod-ridge-live-lod"
position = [256.0, 82.0, 220.0]
look_at = [282.0, 64.0, 250.0]
time_of_day = 0.42
hold_frames = 240
screenshot = true
fog_tier = "off"
motion = { kind = "run", end_position = [336.0, 82.0, 300.0], end_look_at = [360.0, 64.0, 320.0], look_sway_degrees = 12.0 }
screenshot_points = [
  { name = "start", frame = 0 },
  { name = "mid", frame = 120 },
  { name = "end", frame = 239 },
]

[[checkpoint]]
name = "clod-hole-repro-live-lod"
position = [389.6, 52.0, 172.6]
look_at = [430.0, 47.0, 215.0]
time_of_day = 0.45
hold_frames = 360
screenshot = true
fog_tier = "off"
motion = { kind = "run_look_sweep", end_position = [430.0, 52.0, 215.0], end_look_at = [384.0, 47.0, 174.0], look_sway_degrees = 20.0 }
screenshot_points = [
  { name = "approach", frame = 0 },
  { name = "repro", frame = 180 },
  { name = "exit", frame = 359 },
]

[[checkpoint]]
name = "clod-terrain-boundary-sprint"
position = [462.6, 36.0, 400.7]
look_at = [500.0, 32.0, 440.0]
time_of_day = 0.45
hold_frames = 720
screenshot = false
fog_tier = "off"

[checkpoint.gameplay]
start_position = [462.6, 34.5, 400.7]
start_look_at = [500.0, 32.0, 440.0]
movement = [0.0, 1.0]
sprint = true
jump_every_frames = 120
min_horizontal_speed = 2.0
stall_after_frames = 18
max_stall_events = 0
fail_on_stall = true
