# CLOD edit-operation schema fixture.
#
# This scene is primarily a contract for the upcoming bench edit driver. Until
# that driver consumes [[checkpoint.clod_edit]], the normal bench loader should
# either ignore these blocks or this scene should be used only with
# clod_edit_plan_guard.

seed = 12345
duration_warmup_secs = 3.0
median_runs = 1
chunk_load_radius = 7
freeze_terrain_lod_after_ready = false
world_cache_path = "bench-runs/cache/clod-edit-stress-world.bin"

[clod_edit_defaults]
