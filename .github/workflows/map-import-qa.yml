name: Map Import QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/world/source/azgaar/**'
      - 'src/ui/minimap*.rs'
      - 'tools/clod-poc/src/world_source/azgaar/**'
      - 'tools/clod-poc/src/ui/minimap*'
      - 'tools/clod-poc/package.json'
      - 'tools/clod-poc/tsconfig.json'
      - '.github/workflows/map-import-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'src/world/source/azgaar/**'
      - 'src/ui/minimap*.rs'
      - 'tools/clod-poc/src/world_source/azgaar/**'
      - 'tools/clod-poc/src/ui/minimap*'
      - 'tools/clod-poc/package.json'
      - 'tools/clod-poc/tsconfig.json'
      - '.github/workflows/map-import-qa.yml'

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format check
        run: cargo +stable fmt --all -- --check
      - name: Compile all targets
        run: cargo +stable check --all-targets --message-format=short
      - name: Run Azgaar tests
        run: cargo +stable test world::source::azgaar --lib

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/clod-poc
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/clod-poc/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
