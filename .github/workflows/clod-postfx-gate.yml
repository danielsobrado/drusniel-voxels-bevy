name: CLOD PostFX Gate

on:
  push:
    paths:
      - 'tools/clod-poc/src/gpu/webgpu_postprocess.ts'
      - 'tools/clod-poc/src/gpu/postfx_*.ts'
      - 'tools/clod-poc/src/gpu/postfx_*.test.ts'
      - 'tools/clod-poc/src/environment/config/postfx_*.yaml'
      - 'tools/clod-poc/src/environment/config/postprocess.yaml'
      - 'tools/clod-poc/package.json'
      - 'tools/clod-poc/package-lock.json'
      - '.github/workflows/clod-postfx-gate.yml'
  pull_request:
    paths:
      - 'tools/clod-poc/src/gpu/webgpu_postprocess.ts'
      - 'tools/clod-poc/src/gpu/postfx_*.ts'
      - 'tools/clod-poc/src/gpu/postfx_*.test.ts'
      - 'tools/clod-poc/src/environment/config/postfx_*.yaml'
      - 'tools/clod-poc/src/environment/config/postprocess.yaml'
      - 'tools/clod-poc/package.json'
      - 'tools/clod-poc/package-lock.json'
      - '.github/workflows/clod-postfx-gate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postfx-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/clod-poc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tools/clod-poc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify postfx
        run: npm run postfx:verify
