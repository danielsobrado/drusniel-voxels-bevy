name: CLOD QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/voxel/pages/**'
      - 'src/bin/clod_*'
      - 'assets/config/clod_*'
      - 'bench/scenes/**'
      - 'scripts/*clod*'
      - 'docs/rendering/clod-*'
      - 'assets/shaders/**'
      - '.github/workflows/clod-qa.yml'

jobs:
  clod-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOD_PAGES: '1'
      CLOD_QA_RUN_DIR: bench-runs/ci-clod-qa
      VOXEL_CLOD_STATS_CSV: '1'
      VOXEL_CLOD_REBUILD_CSV: '1'
      VOXEL_CLOD_CROSSFADE_BRIDGE: '1'
      VOXEL_CLOD_CROSSFADE_MATERIAL: '1'
      VOXEL_CLOD_CROSSFADE_STATS_CSV: '1'
      VOXEL_CLOD_CUT_FREEZE_CSV: '1'
      VOXEL_CLOD_BORDER_LOCK_CSV: '1'
      VOXEL_CLOD_TOPOLOGY_CSV: '1'
      VOXEL_CLOD_SIMPLIFY_CSV: '1'
      VOXEL_CLOD_WELD_CSV: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Check all binaries
        run: cargo check --bins
      - name: Compile tests without running
        run: cargo test --no-run
      - name: Check CLOD shell scripts
        run: |
          bash -n scripts/*clod*.sh scripts/run-clod-*.sh scripts/guard-clod-*.sh scripts/export-clod-*.sh scripts/report-clod-*.sh
      - name: Run final CLOD QA
        run: scripts/run-clod-final-qa.sh
      - name: Upload CLOD QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clod-qa-artifacts
          path: |
            bench-runs/ci-clod-qa
            perf-dumps
          if-no-files-found: warn
