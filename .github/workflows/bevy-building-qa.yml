name: Bevy Building QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/gameplay/building/**'
      - 'src/gameplay/input/**'
      - 'src/gameplay/spells/**'
      - 'src/voxel/core/**'
      - 'src/world/rules.rs'
      - 'assets/config/inputs.yaml'
      - 'assets/config/spells.yaml'
      - 'tests/input_config_tests.rs'
      - '.github/workflows/bevy-building-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'src/gameplay/building/**'
      - 'src/gameplay/input/**'
      - 'src/gameplay/spells/**'
      - 'assets/config/inputs.yaml'
      - 'assets/config/spells.yaml'
      - 'tests/input_config_tests.rs'
      - '.github/workflows/bevy-building-qa.yml'

jobs:
  bevy-building-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Compile library
        run: cargo check --lib --message-format=short
      - name: Run building tests
        run: cargo test building:: --lib
      - name: Run input config tests
        run: cargo test --test input_config_tests
