name: CLOD GPU Hierarchy Gate

on:
  push:
    paths:
      - 'tools/clod-poc/src/terrain/streaming/gpu_clod_*.ts'
      - 'tools/clod-poc/src/terrain/streaming/root_height_morph.ts'
      - 'tools/clod-poc/src/terrain/streaming/streamed_page_bounds_guard*.ts'
      - 'tools/clod-poc/src/terrain/rendering/clod_render_node_cache.ts'
      - 'tools/clod-poc/src/rendering/webgpu_*.ts'
      - 'tools/clod-poc/src/cache/clodStreamRootCache.ts'
      - 'tools/clod-poc/src/ui/gui/clod_gui.ts'
      - 'tools/clod-poc/src/app/bootstrap/ui/imported_state_startup.ts'
      - 'tools/clod-poc/tools/benchmark-gpu-clod-resident.ts'
      - 'tools/clod-poc/src/types.ts'
      - 'tools/clod-poc/package.json'
      - 'tools/clod-poc/package-lock.json'
      - '.github/workflows/clod-gpu-hierarchy-gate.yml'
  pull_request:
    paths:
      - 'tools/clod-poc/src/terrain/streaming/gpu_clod_*.ts'
      - 'tools/clod-poc/src/terrain/streaming/root_height_morph.ts'
      - 'tools/clod-poc/src/terrain/streaming/streamed_page_bounds_guard*.ts'
      - 'tools/clod-poc/src/terrain/rendering/clod_render_node_cache.ts'
      - 'tools/clod-poc/src/rendering/webgpu_*.ts'
      - 'tools/clod-poc/src/cache/clodStreamRootCache.ts'
      - 'tools/clod-poc/src/ui/gui/clod_gui.ts'
      - 'tools/clod-poc/src/app/bootstrap/ui/imported_state_startup.ts'
      - 'tools/clod-poc/tools/benchmark-gpu-clod-resident.ts'
      - 'tools/clod-poc/src/types.ts'
      - 'tools/clod-poc/package.json'
      - 'tools/clod-poc/package-lock.json'
      - '.github/workflows/clod-gpu-hierarchy-gate.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hierarchy-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/clod-poc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tools/clod-poc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused hierarchy tests
        run: >-
          npx vitest run
          src/terrain/streaming/gpu_clod_hierarchy.test.ts
          src/terrain/streaming/gpu_clod_runtime_review.test.ts
          src/terrain/streaming/gpu_clod_page_pipeline_layout.test.ts
          src/terrain/streaming/gpu_clod_root_mesher_pool.test.ts
          src/terrain/streaming/gpu_clod_root_mesher_disposal.test.ts
          src/terrain/streaming/gpu_clod_resident_registry.test.ts
          src/terrain/streaming/gpu_clod_resident_adoption.test.ts
          src/terrain/streaming/gpu_clod_resident_cache_lease.test.ts
          src/terrain/streaming/streamed_page_bounds_guard_resident.test.ts
          src/rendering/webgpu_device_bridge.test.ts
          src/rendering/webgpu_external_buffer_geometry.test.ts
          src/terrain/streaming/root_height_morph.test.ts
